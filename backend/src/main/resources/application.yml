server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: logisticaportuaria-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logisticaportuaria}
    username: ${DB_USER:logisticaportuaria}
    password: ${DB_PASSWORD:logisticaportuaria}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: logisticaportuaria-backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  gate:
    # Confianza mínima para aprobar una lectura de forma automática.
    min-confidence: ${GATE_MIN_CONFIDENCE:0.75}
    # Ventana (± minutos) para conciliar una lectura con una cita.
    window-minutes: ${GATE_WINDOW_MINUTES:30}
    # Exigir una cita vigente para la matrícula leída.
    require-appointment-for-plates: ${GATE_REQUIRE_APPOINTMENT:true}
    # Rechazar los contenedores retenidos en puerta (GATE_HOLD).
    block-on-gate-hold: ${GATE_BLOCK_ON_HOLD:true}
    # Ventana para asociar la lectura de un contenedor a la visita abierta.
    visit-match-window-minutes: ${GATE_VISIT_MATCH_WINDOW:30}
  edge:
    # Clave compartida con el servicio de borde (cabecera X-Edge-Api-Key).
    api-key: ${EDGE_API_KEY:}
    # Permite la ingesta sin clave (solo para desarrollo local).
    open-ingestion: ${EDGE_OPEN_INGESTION:false}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    # MQTT_URL manda; si no está, se compone con MQTT_HOST/MQTT_PORT (así funciona
    # el docker-compose del arquitecto, que define MQTT_HOST=mosquitto).
    url: ${MQTT_URL:mqtt://${MQTT_HOST:localhost}:${MQTT_PORT:1883}}
    gate-events-topic: ${MQTT_GATE_TOPIC:yard/+/gate/+/events}
    client-id: ${MQTT_CLIENT_ID:logisticaportuaria-backend}
    qos: ${MQTT_QOS:1}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    reconnect-delay-seconds: ${MQTT_RECONNECT_DELAY:10}
  optimizer:
    # Patio del optimizador; vacío = todos los patios (demo de un solo patio).
    yard-id: ${OPTIMIZER_YARD_ID:}
    # Tamaño del Top-N que devuelve /recommendations.
    top-recommendations: ${OPTIMIZER_TOP_N:3}
    # Candidatos por contenedor que se pasan al modelo CP-SAT (poda del modelo).
    max-candidates: ${OPTIMIZER_MAX_CANDIDATES:32}
    # Límite por defecto de los planes asíncronos, en segundos.
    default-time-limit-seconds: ${OPTIMIZER_TIME_LIMIT:30}
    # Pesos del objetivo (menor es mejor); ver docs/architecture/optimizer-model.md.
    weights:
      restow: ${OPTIMIZER_W_RESTOW:4.0}
      distance: ${OPTIMIZER_W_DISTANCE:2.0}
      dispersion: ${OPTIMIZER_W_DISPERSION:0.5}
      height: ${OPTIMIZER_W_HEIGHT:0.3}
      weight-order: ${OPTIMIZER_W_WEIGHT_ORDER:1.0}
  congestion:
    # Patio del módulo; vacío = todos los patios (demo de un solo patio).
    yard-id: ${CONGESTION_YARD_ID:}
    # Job programado cada 5 minutos (deshabilitado en pruebas y demos offline).
    scheduling-enabled: ${CONGESTION_SCHEDULING:true}
    refresh-ms: ${CONGESTION_REFRESH_MS:300000}
    initial-delay-ms: ${CONGESTION_INITIAL_DELAY_MS:60000}
    # Ventana de histórico usada para entrenar el modelo.
    history-days: ${CONGESTION_HISTORY_DAYS:28}
    # Minutos que se reutiliza el modelo entrenado antes de reentrenar.
    retrain-minutes: ${CONGESTION_RETRAIN_MINUTES:60}
    # Días de pronósticos conservados en congestion_forecast.
    retention-days: ${CONGESTION_RETENTION_DAYS:7}
    # Umbrales de espera (min) para los niveles de riesgo.
    medium-risk-minutes: ${CONGESTION_MEDIUM_RISK:15}
    high-risk-minutes: ${CONGESTION_HIGH_RISK:30}
    # Alertas MQTT/STOMP cuando el riesgo es ALTO.
    alerts-enabled: ${CONGESTION_ALERTS:true}
    alert-topic: ${CONGESTION_ALERT_TOPIC:yard/%s/alerts/congestion}
    # Temporada del suavizado de llegadas (96 franjas de 15 min = un día).
    season-length: ${CONGESTION_SEASON_LENGTH:96}
    max-training-rows: ${CONGESTION_MAX_TRAINING_ROWS:2000}
  fleet:
    # Patio del módulo; vacío = el único patio de la base (demo de un solo patio).
    yard-id: ${FLEET_YARD_ID:}
    # Suscripción al tema de telemetría (se apaga en pruebas; se usa handleTopic).
    mqtt-enabled: ${FLEET_MQTT_ENABLED:true}
    telemetry-topic: ${FLEET_TELEMETRY_TOPIC:yard/+/fleet/+/telemetry}
    # Job de difusión WebSocket, monitor de silencio y retención.
    scheduling-enabled: ${FLEET_SCHEDULING:true}
    # Velocidades (km/h): máxima física para descartar saltos y límite de alerta.
    max-speed-kmh: ${FLEET_MAX_SPEED:40}
    speed-limit-kmh: ${FLEET_SPEED_LIMIT:15}
    # Ralentí: minutos detenido y velocidad que cuenta como detenido.
    idle-minutes: ${FLEET_IDLE_MINUTES:10}
    idle-speed-kmh: ${FLEET_IDLE_SPEED:1}
    # Batería baja (%) y silencio (segundos) que generan alerta.
    battery-low-pct: ${FLEET_BATTERY_LOW:20}
    silence-seconds: ${FLEET_SILENCE_SECONDS:60}
    # Minutos antes de repetir la misma alerta del mismo vehículo.
    alert-cooldown-minutes: ${FLEET_ALERT_COOLDOWN:10}
    # Intervalo del agregado STOMP (ms).
    broadcast-interval-ms: ${FLEET_BROADCAST_MS:1000}
    # Retención y downsampling de vehicle_position.
    retention-days: ${FLEET_RETENTION_DAYS:30}
    downsample-after-hours: ${FLEET_DOWNSAMPLE_HOURS:24}
    downsample-seconds: ${FLEET_DOWNSAMPLE_SECONDS:10}
    # Refresco de las cachés de geocercas y vehículos (s).
    geofence-refresh-seconds: ${FLEET_GEOFENCE_REFRESH:60}
    # Límites de puntos de las consultas (KPI y track).
    kpi-max-points: ${FLEET_KPI_MAX_POINTS:50000}
    track-max-points: ${FLEET_TRACK_MAX_POINTS:5000}
    # Alertas recientes en memoria para los KPI (sin tabla, ver ADR-014).
    alert-buffer-size: ${FLEET_ALERT_BUFFER:10000}
  security:
    jwt:
      # Secreto HS256 para desarrollo y pruebas. En producción usar Keycloak
      # (jwk-set-uri o issuer-uri).
      secret: ${JWT_SECRET:}
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      issuer-uri: ${JWT_ISSUER_URI:}
      expires-in-seconds: ${JWT_EXPIRES_IN:3600}

logging:
  level:
    root: INFO
    cr.logisticaportuaria: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
